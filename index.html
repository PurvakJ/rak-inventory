<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>BoxStock | Unified Filters · INVENTORY UI</title>
  <!-- jsPDF + autoTable -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  <!-- Replace the existing jsPDF script tags with these -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }
    body {
      background: #ffffff;
      color: #000000;
      overflow-x: hidden;
    }
    button {
      cursor: pointer;
      transition: all 0.1s linear;
      border: none;
    }
    /* Toast - sharp INVENTORY */
    .toast {
      position: fixed;
      bottom: 30px;
      right: 30px;
      background: #1e1e1e;
      color: white;
      padding: 12px 24px;
      border-radius: 0px;
      font-size: 14px;
      font-weight: 500;
      z-index: 3000;
      opacity: 0;
      transform: translateY(15px);
      transition: all 0.2s ease;
      pointer-events: none;
      box-shadow: 8px 8px 0 rgba(0,0,0,0.12);
      border-left: 5px solid #ffffff;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast.success { background: #0b2f26; border-left-color: #2ecc71; }
    .toast.error { background: #4a1515; border-left-color: #e74c3c; }

    /* LOGIN - INVENTORY */
    #loginPage {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f5f7fa;
      padding: 20px;
    }
    .login-box {
      width: 100%;
      max-width: 440px;
      background: #ffffff;
      padding: 42px 40px;
      box-shadow: 14px 14px 0 rgba(0,0,0,0.04);
      border: 1.5px solid #eaeef2;
      text-align: center;
    }
    .login-box h2 {
      margin-bottom: 32px;
      font-weight: 800;
      font-size: 32px;
      color: #000;
    }
    .login-box input {
      width: 100%;
      padding: 16px 18px;
      margin-bottom: 22px;
      border: 1.5px solid #d0d7de;
      background: white;
      font-size: 15px;
    }
    .login-box input:focus {
      border-color: #000;
      outline: none;
    }
    .login-box button {
      width: 100%;
      padding: 16px;
      background: #000;
      color: white;
      font-size: 16px;
      font-weight: 700;
      box-shadow: 5px 5px 0 #cbd5e1;
    }
    .login-box button:hover {
      background: #2c2c2c;
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 #cbd5e1;
    }

    /* APP */
    #app { display: none; }
    .layout { display: flex; min-height: 100vh; }

    /* SIDEBAR */
    .sidebar {
      width: 280px;
      background: #111111;
      color: #f0f0f0;
      padding: 32px 24px;
      transition: 0.2s;
      z-index: 110;
      border-right: 1px solid #2a2a2a;
    }
    .sidebar h2 {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 48px;
      color: white;
    }
    .menu-btn {
      width: 100%;
      padding: 14px 18px;
      margin-bottom: 14px;
      background: #1e1e1e;
      color: #efefef;
      text-align: left;
      font-size: 15px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .menu-btn:hover {
      background: #2c2c2c;
      transform: translateX(5px);
    }
    .logout-btn {
      background: #3a1c1c;
      margin-top: 40px;
    }
    .pdf-export-btn {
      background: #1a1a1a;
      color: white;
      padding: 10px 20px;
      font-weight: 700;
      font-size: 0.8rem;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 3px 3px 0 #b0b0b0;
    }
    .pdf-export-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 #b0b0b0;
    }

    /* MAIN */
    .main {
      flex: 1;
      padding: 32px 36px;
      overflow-x: auto;
      background: #ffffff;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
      flex-wrap: wrap;
      gap: 16px;
    }
    .topbar h1 {
      font-size: 32px;
      font-weight: 800;
      color: #000;
      letter-spacing: -0.4px;
    }
    .page { display: none; }
    .active-page { display: block; }

    /* CARDS */
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 24px;
      margin-bottom: 40px;
    }
    .card {
      background: #ffffff;
      padding: 26px 28px;
      box-shadow: 8px 8px 0 rgba(0,0,0,0.03);
      border: 1.5px solid #e2e8f0;
    }
    .card h3 {
      font-size: 13px;
      text-transform: uppercase;
      font-weight: 700;
      color: #3a4a5c;
      margin-bottom: 12px;
    }
    .card h1 { font-size: 48px; font-weight: 800; color: #000; }

    /* ---- SINGLE LINE FILTER ROW (ALL FILTERS TOGETHER) ---- */
    .filter-single-line {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      background: #ffffff;
      border: 1.5px solid #eef2f8;
      padding: 12px 20px;
      margin-bottom: 28px;
      box-shadow: 4px 4px 0 rgba(0,0,0,0.02);
    }
    .filter-single-line .filter-group {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #fcfcfd;
      padding: 4px 8px;
      border: 1px solid #e2e8f0;
    }
    .filter-single-line .filter-group label {
      font-size: 12px;
      font-weight: 700;
      color: #1f2a3e;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    .filter-single-line input, 
    .filter-single-line select {
      padding: 8px 12px;
      border: 1px solid #cfdde6;
      background: white;
      font-size: 13px;
      min-width: 130px;
      color: #000;
    }
    .filter-single-line input:focus, 
    .filter-single-line select:focus {
      border-color: #000;
      outline: none;
    }
    .filter-single-line .lowstock-badge {
      background: #f9f1f1;
      border: 1.5px solid #e0cbcb;
      color: #b91c1c;
      padding: 8px 16px;
      font-weight: 700;
      font-size: 0.75rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: 0.1s;
    }
    .filter-single-line .lowstock-badge.active {
      background: #1f1f1f;
      color: white;
      border-color: #2c2c2c;
    }
    .filter-single-line .clear-btn {
      background: #f0f2f5;
      border: 1px solid #d4dce4;
      padding: 8px 22px;
      font-weight: 700;
      font-size: 13px;
    }
    .filter-single-line .clear-btn:hover {
      background: #e4e8ed;
      transform: scale(0.96);
    }

    /* PRODUCT GRID */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 28px;
      margin-top: 12px;
    }
    .product-card {
      background: #ffffff;
      box-shadow: 6px 8px 0 rgba(0,0,0,0.02);
      border: 1px solid #eaedf2;
      transition: 0.2s ease;
      display: flex;
      flex-direction: column;
    }
    .product-card:hover {
      transform: translateY(-4px);
      border-color: #cbdae6;
    }
    .product-info { padding: 22px 24px 12px 24px; flex: 1; }
    .product-title {
      font-size: 1.45rem;
      font-weight: 800;
      color: #000;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      flex-wrap: wrap;
    }
    .product-category {
      font-size: 0.7rem;
      background: #f0f2f5;
      padding: 5px 14px;
      font-weight: 700;
    }
    .product-details {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin: 16px 0;
      font-size: 0.85rem;
    }
    .detail-badge {
      background: #f6f8fa;
      padding: 6px 14px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid #eceff3;
    }
    .stock-info {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-top: 16px;
      padding-top: 14px;
      border-top: 2px solid #eef2f6;
    }
    .stock-value { font-size: 2rem; font-weight: 800; color: #000; }
    .low-stock-warning {
      color: #b91c1c;
      background: #fff2f2;
      padding: 6px 14px;
      font-size: 0.7rem;
      font-weight: 800;
      border: 1px solid #f3d7d7;
    }
    .action-bar {
      display: flex;
      gap: 12px;
      padding: 16px 24px 24px 24px;
      background: #fefefe;
      border-top: 1px solid #edeff4;
      flex-wrap: wrap;
      justify-content: space-between;
    }
    .action-btn {
      border: 1px solid #e2e6ec;
      padding: 8px 16px;
      font-weight: 700;
      font-size: 0.75rem;
      background: white;
    }
    .action-btn:active { transform: scale(0.96); }
    .btn-green { background: #f2f7f2; color: #1a5a3a; }
    .btn-red { background: #fef5f5; color: #b53b3b; }
    .btn-orange { background: #fff6f0; color: #bc4e1a; }
    .btn-dark { background: #f4f6f9; color: #1f2e3f; }

    /* MODAL */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.75);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      visibility: hidden;
      opacity: 0;
      transition: 0.1s;
    }
    .modal-overlay.active { visibility: visible; opacity: 1; }
    .modal-container {
      background: white;
      width: 90%;
      max-width: 680px;
      padding: 32px 36px;
      box-shadow: 18px 18px 0 rgba(0,0,0,0.1);
      border: 1px solid #dce3ea;
    }
    .modal-form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-top: 22px;
    }
    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 18px;
      margin-top: 34px;
    }
    .modal-save {
      background: #000;
      color: white;
      padding: 12px 28px;
      font-weight: 700;
      box-shadow: 4px 4px 0 #aaa;
    }
    .modal-save:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 #aaa; }
    .modal-cancel {
      background: #f0f2f5;
      padding: 12px 28px;
      font-weight: 600;
      border: 1px solid #dee2e8;
    }
    .floating-add-btn {
      position: fixed;
      bottom: 30px;
      right: 30px;
      width: 62px;
      height: 62px;
      background: #000;
      color: white;
      box-shadow: 8px 8px 0 rgba(0,0,0,0.08);
      font-size: 30px;
      font-weight: bold;
      z-index: 1050;
    }
    .floating-add-btn:hover { background: #2c2c2c; transform: scale(0.96); }
    .mobile-top {
      display: none;
      background: #111;
      color: white;
      padding: 16px 20px;
      justify-content: space-between;
      align-items: center;
    }
    .mobile-top button {
      background: #2c2c2c;
      padding: 8px 18px;
      color: white;
      font-weight: bold;
    }
    @media (max-width: 860px) {
      .sidebar { position: fixed; left: -300px; top: 0; height: 100%; z-index: 1200; width: 270px; }
      .sidebar.active { left: 0; }
      .mobile-top { display: flex; }
      .main { padding: 20px; }
      .product-grid { grid-template-columns: 1fr; }
      .modal-form-grid { grid-template-columns: 1fr; }
      .filter-single-line { flex-direction: column; align-items: stretch; }
      .filter-single-line .filter-group { justify-content: space-between; }
    }
    .table-wrapper { overflow-x: auto; margin-top: 20px; border: 1px solid #eef2f5; }
    table { width: 100%; border-collapse: collapse; background: white; }
    th { background: #111; color: white; padding: 14px; font-weight: 700; text-align: left; }
    td { padding: 12px; border-bottom: 1px solid #e9ecf0; color: #111; }
    .topbar-right { display: flex; gap: 14px; align-items: center; }
    .loading-badge { display: inline-block; width: 14px; height: 14px; border: 2px solid #cbd5e1; border-top-color: #1f6392; border-radius: 0; animation: spin 0.6s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div id="loginPage">
  <div class="login-box">
    <h2>📦 INVENTORY STOCK</h2>
    <input type="text" id="username" placeholder="Username" autocomplete="off">
    <input type="password" id="password" placeholder="Password">
    <button onclick="login()">ENTER →</button>
  </div>
</div>

<div id="app">
  <div class="toast" id="toastMsg"></div>
  <div class="mobile-top"><h2>📦 INVENTORY</h2><button onclick="toggleSidebar()">☰ MENU</button></div>
  <div class="layout">
    <div class="sidebar" id="sidebar">
      <h2>BOXSTOCK</h2>
      <button class="menu-btn" onclick="showPage('dashboardPage')">📊 DASHBOARD</button>
      <button class="menu-btn" onclick="showPage('productsPage')">📦 PRODUCTS</button>
      <button class="menu-btn" onclick="showPage('auditPage')">📜 AUDIT</button>
      <button class="menu-btn" onclick="changePassword()">🔐 CHANGE PWD</button>
      <button class="menu-btn logout-btn" onclick="logout()">🚪 LOGOUT</button>
    </div>
    <div class="main">
      <!-- DASHBOARD -->
      <div id="dashboardPage" class="page active-page">
        <div class="topbar"><h1>Dashboard</h1><div class="topbar-right"></div></div>
        <div class="cards">
          <div class="card"><h3>Total Products</h3><h1 id="totalProducts">0</h1></div>
          <div class="card"><h3>Total Stock (units)</h3><h1 id="totalStock">0</h1></div>
          <div class="card"><h3>⚠️ Low Stock Items</h3><h1 id="lowStock">0</h1></div>
        </div>
      </div>

      <!-- PRODUCTS PAGE – SINGLE LINE FILTERS (ALL TOGETHER) -->
      <div id="productsPage" class="page">
        <div class="topbar"><h1>🛒 Products</h1><div class="topbar-right"><button class="pdf-export-btn" onclick="exportProductsToPDF()">📄 PDF Export</button></div></div>
        
        <!-- EVERY FILTER IN ONE ROW: brand + product + category + unit + lowstock button + clear -->
        <div class="filter-single-line">
          <div class="filter-group"><label>🏷️ BRAND</label><input type="text" id="filterBrand" placeholder="Brand" onkeyup="applyFilters()"></div>
          <div class="filter-group"><label>📦 PRODUCT</label><input type="text" id="filterProduct" placeholder="Product name" onkeyup="applyFilters()"></div>
          <div class="filter-group"><label>📂 CATEGORY</label><select id="filterCategory" onchange="applyFilters()"><option value="">All</option><option>Mattress</option><option>Office Chair</option><option>Plastic Chair</option><option>Cloth</option><option>Foam</option></select></div>
          <div class="filter-group"><label>📏 UNIT</label><select id="filterType" onchange="applyFilters()"><option value="">All Units</option><option>pcs</option><option>meter</option><option>bundle</option><option>kg</option></select></div>
          <div id="lowStockFilterBtn" class="lowstock-badge" onclick="toggleLowStockFilter()">⚠️ LOW STOCK</div>
          <button class="clear-btn" onclick="clearProductFilters()">🗑 CLEAR</button>
        </div>
        
        <div id="productGridContainer" class="product-grid"></div>
      </div>

      <!-- AUDIT PAGE -->
      <div id="auditPage" class="page">
        <div class="topbar"><h1>Audit Logs</h1><div class="topbar-right"><button class="pdf-export-btn" onclick="exportAuditToPDF()">📄 Export Audit</button></div></div>
        <div class="filter-single-line" style="margin-bottom: 20px;">
          <div class="filter-group"><label>🔍 ACTION</label><input type="text" id="auditActionFilter" placeholder="ADD/REDUCE/EDIT" onkeyup="applyAuditFilters()"></div>
          <div class="filter-group"><label>📦 PRODUCT</label><input type="text" id="auditProductFilter" placeholder="Product name" onkeyup="applyAuditFilters()"></div>
          <div class="filter-group"><label>📅 DATE</label><input type="date" id="auditDateFilter" onchange="applyAuditFilters()"></div>
          <button class="clear-btn" onclick="clearAuditFilters()">CLEAR</button>
        </div>
        <div class="card"><div class="table-wrapper"><table><thead><tr><th>Action</th><th>Product</th><th>Qty</th><th>Details</th><th>Date</th></tr></thead><tbody id="auditTable"></tbody></table></div></div>
      </div>
    </div>
  </div>
  <button class="floating-add-btn" onclick="openProductDialog()">+</button>
  
  <!-- MODAL -->
  <div id="productModal" class="modal-overlay">
    <div class="modal-container">
      <h3 id="modalTitle">Add Product</h3>
      <div class="modal-form-grid">
        <select id="modalCategory"><option value="">Category</option><option>Mattress</option><option>Office Chair</option><option>Plastic Chair</option><option>Cloth</option><option>Foam</option></select>
        <input type="text" id="modalBrand" placeholder="Brand">
        <input type="text" id="modalProductName" placeholder="Product Name">
        <input type="text" id="modalSize" placeholder="Size (optional)">
        <select id="modalQuantityType"><option value="">Units</option><option>pcs</option><option>meter</option><option>bundle</option><option>kg</option></select>
        <input type="number" id="modalPresentStock" placeholder="Stock">
        <input type="number" id="modalMinimumStock" placeholder="Min Stock">
      </div>
      <div class="modal-actions"><button class="modal-cancel" onclick="closeModal()">Cancel</button><button class="modal-save" onclick="saveProductFromModal()">Save</button></div>
    </div>
  </div>
</div>

<script>
const API_URL = "";
let products = [], filteredProducts = [], audits = [], filteredAudits = [];
let editingProductId = null;
let pendingSync = new Set();
let lowStockActive = false;

function showToast(msg, type='success') { const t=document.getElementById('toastMsg'); t.textContent=msg; t.className=`toast ${type} show`; setTimeout(()=>t.classList.remove('show'),2200); }
async function api(action, data={}, silent=false) { try { const res=await fetch(API_URL,{method:"POST",body:JSON.stringify({action,...data})}); return await res.json(); } catch(err){ if(!silent) showToast(`Sync error: ${err.message}`,'error'); return {success:false,error:err.message}; } }
async function loadProducts() { const res=await api("getProducts"); if(res.success) { products=res.products||[]; applyFilters(); updateDashboardUI(); } }
async function loadAuditSilent() { const res=await api("getAudit",{},true); if(res.success && res.audit) { audits=res.audit; filteredAudits=[...audits]; renderAudit(); } }

function updateDashboardUI() {
  let totalStockUnits=0, lowCount=0;
  products.forEach(p=>{ totalStockUnits+=Number(p.presentStock); if(Number(p.presentStock)<=Number(p.minimumStock)) lowCount++; });
  document.getElementById("totalProducts").innerText=products.length;
  document.getElementById("totalStock").innerText=totalStockUnits;
  document.getElementById("lowStock").innerText=lowCount;
}

function applyFilters() {
  const category = document.getElementById("filterCategory")?.value.toLowerCase() || "";
  const brand = document.getElementById("filterBrand")?.value.toLowerCase() || "";
  const product = document.getElementById("filterProduct")?.value.toLowerCase() || "";
  const type = document.getElementById("filterType")?.value.toLowerCase() || "";
  let temp = products.filter(p => 
    p.category.toLowerCase().includes(category) &&
    p.brand.toLowerCase().includes(brand) &&
    p.productName.toLowerCase().includes(product) &&
    p.quantityType.toLowerCase().includes(type)
  );
  if(lowStockActive) temp = temp.filter(p => Number(p.presentStock) <= Number(p.minimumStock));
  filteredProducts = temp;
  renderProductsGrid();
}

function toggleLowStockFilter() {
  lowStockActive = !lowStockActive;
  const btn = document.getElementById("lowStockFilterBtn");
  if(lowStockActive) { btn.classList.add("active"); btn.innerHTML = "⚠️ LOW STOCK (ON)"; showToast("Low stock filter active","success"); } 
  else { btn.classList.remove("active"); btn.innerHTML = "⚠️ LOW STOCK"; showToast("Low stock filter off","success"); }
  applyFilters();
}

function clearProductFilters() {
  document.getElementById("filterBrand").value = "";
  document.getElementById("filterProduct").value = "";
  document.getElementById("filterCategory").value = "";
  document.getElementById("filterType").value = "";
  if(lowStockActive) toggleLowStockFilter();
  else applyFilters();
  showToast("All product filters cleared","success");
}

function renderProductsGrid() {
  const container = document.getElementById("productGridContainer");
  if(!container) return;
  if(filteredProducts.length===0) { container.innerHTML=`<div class="card" style="text-align:center;">✨ No products match filters</div>`; return; }
  container.innerHTML = filteredProducts.map(prod => {
    const isLow = Number(prod.presentStock) <= Number(prod.minimumStock);
    const isSyncing = pendingSync.has(prod.id);
    return `
    <div class="product-card" data-product-id="${prod.id}">
      <div class="product-info">
        <div class="product-title"><span>${escapeHtml(prod.productName)}</span><span class="product-category">${escapeHtml(prod.category)}</span></div>
        <div class="product-details"><span class="detail-badge">🏷️ ${escapeHtml(prod.brand)}</span><span class="detail-badge">📏 ${escapeHtml(prod.size||'N/A')}</span><span class="detail-badge">📦 ${escapeHtml(prod.quantityType)}</span></div>
        <div class="stock-info"><div><span style="font-size:0.8rem;">Current stock</span><br><span class="stock-value">${prod.presentStock}</span> <span style="font-size:0.8rem;">${prod.quantityType}</span></div><div><span style="font-size:0.8rem;">Min threshold</span><br><strong>${prod.minimumStock}</strong></div>${isLow ? '<div class="low-stock-warning">⚠️ LOW STOCK</div>' : ''}</div>
      </div>
      <div class="action-bar">
        <button class="action-btn btn-green" onclick="addStockInstant('${prod.id}')">➕ Add</button>
        <button class="action-btn btn-red" onclick="reduceStockInstant('${prod.id}')">➖ Reduce</button>
        <button class="action-btn btn-orange" onclick="editProduct('${prod.id}')">✏️ Edit</button>
        <button class="action-btn btn-dark" onclick="deleteProductInstant('${prod.id}')">🗑 Delete</button>
        ${isSyncing ? '<span class="loading-badge"></span>' : ''}
      </div>
    </div>`;
  }).join('');
}

async function addStockInstant(id) {
  let qty = prompt("➕ Enter quantity to add:");
  if(!qty || isNaN(qty) || Number(qty)<=0) return;
  const product = products.find(p=>p.id==id);
  if(!product) return;
  product.presentStock = Number(product.presentStock) + Number(qty);
  applyFilters(); updateDashboardUI();
  showToast(`+${qty} added to ${product.productName}`,'success');
  pendingSync.add(id); renderProductsGrid();
  await api("addStock",{id,quantity:qty},true);
  pendingSync.delete(id); renderProductsGrid();
  await loadAuditSilent();
}
async function reduceStockInstant(id) {
  let qty = prompt("➖ Enter quantity to reduce:");
  if(!qty || isNaN(qty) || Number(qty)<=0) return;
  const product = products.find(p=>p.id==id);
  if(!product) return;
  if(Number(product.presentStock) < Number(qty)) { showToast("Insufficient stock!",'error'); return; }
  product.presentStock = Number(product.presentStock) - Number(qty);
  applyFilters(); updateDashboardUI();
  showToast(`-${qty} reduced from ${product.productName}`,'success');
  pendingSync.add(id); renderProductsGrid();
  await api("reduceStock",{id,quantity:qty},true);
  pendingSync.delete(id); renderProductsGrid();
  await loadAuditSilent();
}
async function deleteProductInstant(id) {
  if(!confirm("⚠️ Delete product permanently?")) return;
  const product = products.find(p=>p.id==id);
  products = products.filter(p=>p.id!=id);
  applyFilters(); updateDashboardUI();
  showToast(`🗑 Deleted ${product.productName}`,'success');
  await api("deleteProduct",{id},true);
  await loadAuditSilent();
}
function openProductDialog() { editingProductId=null; document.getElementById("modalTitle").innerText="Add New Product"; clearModalFields(); document.getElementById("productModal").classList.add("active"); }
function closeModal() { document.getElementById("productModal").classList.remove("active"); editingProductId=null; }
function clearModalFields() { document.querySelectorAll("#modalCategory, #modalBrand, #modalProductName, #modalSize, #modalQuantityType, #modalPresentStock, #modalMinimumStock").forEach(f=>f.value=""); }
function editProduct(id) {
  const product = products.find(p=>p.id==id);
  if(!product) return;
  editingProductId=id;
  document.getElementById("modalTitle").innerText="Edit Product";
  document.getElementById("modalCategory").value=product.category||"";
  document.getElementById("modalBrand").value=product.brand||"";
  document.getElementById("modalProductName").value=product.productName||"";
  document.getElementById("modalSize").value=product.size||"";
  document.getElementById("modalQuantityType").value=product.quantityType||"";
  document.getElementById("modalPresentStock").value=product.presentStock;
  document.getElementById("modalMinimumStock").value=product.minimumStock;

}
async function saveProductFromModal() {
  const category = document.getElementById("modalCategory").value.trim();
  const brand = document.getElementById("modalBrand").value.trim();
  const productName = document.getElementById("modalProductName").value.trim();
  const size = document.getElementById("modalSize").value.trim();
  const quantityType = document.getElementById("modalQuantityType").value.trim();
  const presentStock = Number(document.getElementById("modalPresentStock").value);
  const minimumStock = Number(document.getElementById("modalMinimumStock").value);
  if(!category||!brand||!productName||!quantityType||isNaN(presentStock)||isNaN(minimumStock)) { showToast("Fill all required fields",'error'); return; }
  if(editingProductId!==null) {
    const idx = products.findIndex(p=>p.id==editingProductId);
    if(idx!==-1) { products[idx]={...products[idx],category,brand,productName,size,quantityType,presentStock,minimumStock}; applyFilters(); updateDashboardUI(); showToast(`✏️ Updated ${productName}`,'success'); closeModal(); await api("editProduct",products[idx],true); await loadAuditSilent(); }
  } else {
    const newProduct={id:Date.now(),category,brand,productName,size,quantityType,presentStock,minimumStock,createdAt:new Date()};
    products.unshift(newProduct); applyFilters(); updateDashboardUI(); showToast(`✨ Added ${productName}`,'success'); closeModal(); await api("addProduct",newProduct,true); await loadAuditSilent();
  }
}
